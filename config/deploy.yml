# Kamal config for Single Server.
# Generated by `singleserver inspect` — the healthcheck/boot window was raised
# from 10s to 60s because first boot runs cache-clear + migrate + optimize,
# which takes longer than 10s on a 2-vCPU box.
service: 2026-05-14-vault
image: 2026-05-14-vault
servers:
  web:
    hosts:
      - 127.0.0.1
    options:
      stop-timeout: 30
      # NOTE: no `init: true` here — serversideup images use s6-overlay,
      # which must run as PID 1. Docker's --init (tini) breaks it (exit 100).
ssh:
  user: deploy
  keys:
    - /root/.ssh/id_ed25519
registry:
  server: 127.0.0.1:5555
  username: dummy
  password: dummy
builder:
  arch: amd64
  local: true
  driver: docker
  context: .
proxy:
  app_port: 8080
  ssl: false
  forward_headers: true
  healthcheck:
    path: /up
    interval: 1
    timeout: 1
  run:
    bind_ips:
      - 127.0.0.1
env:
  secret:
    - APP_DEBUG
    - APP_ENV
    - APP_KEY
    - DB_DATABASE
    - LOG_CHANNEL
volumes:
  - /srv/storage/2026-05-14-vault:/storage
deploy_timeout: 120
drain_timeout: 5
