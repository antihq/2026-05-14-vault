# Kamal config for Single Server.
# Generated by `singleserver inspect` — the healthcheck/boot window was raised
# from 10s to 60s because first boot runs cache-clear + migrate + optimize,
# which takes longer than 10s on a 2-vCPU box.
service: vault
image: vault
servers:
  web:
    hosts:
      - 127.0.0.1
    options:
      stop-timeout: 30
      memory: 1g
      # NOTE: no `init: true` here — serversideup images use s6-overlay,
      # which must run as PID 1. Docker's --init (tini) breaks it (exit 100).
ssh:
  user: deploy
  keys:
    - /root/.ssh/id_ed25519
registry:
  server: 127.0.0.1:5555
  username: dummy
  password: dummy
builder:
  arch: amd64
  local: true
  driver: docker
  context: .
proxy:
  app_port: 8080
  ssl: false
  forward_headers: true
  healthcheck:
    path: /up
    interval: 15
    timeout: 1
  run:
    bind_ips:
      - 127.0.0.1
env:
  secret:
    - APP_DEBUG
    - APP_ENV
    - APP_KEY
    - APP_URL
    - DB_DATABASE
    - LOG_CHANNEL
    - QUEUE_CONNECTION
    - APP_NAME
    - APP_LOCALE
    - APP_FALLBACK_LOCALE
    - APP_FAKER_LOCALE
    - APP_MAINTENANCE_DRIVER
    - BCRYPT_ROUNDS
    - LOG_STACK
    - LOG_DEPRECATIONS_CHANNEL
    - LOG_LEVEL
    - DB_CONNECTION
    - SESSION_DRIVER
    - SESSION_LIFETIME
    - SESSION_ENCRYPT
    - SESSION_PATH
    - SESSION_DOMAIN
    - BROADCAST_CONNECTION
    - FILESYSTEM_DISK
    - CACHE_STORE
    - MEMCACHED_HOST
    - REDIS_CLIENT
    - REDIS_HOST
    - REDIS_PASSWORD
    - REDIS_PORT
    - MAIL_MAILER
    - MAIL_SCHEME
    - MAIL_HOST
    - MAIL_PORT
    - MAIL_ENCRYPTION
    - MAIL_USERNAME
    - MAIL_PASSWORD
    - MAIL_FROM_ADDRESS
    - MAIL_FROM_NAME
    - AWS_DEFAULT_REGION
    - AWS_USE_PATH_STYLE_ENDPOINT
    - VITE_APP_NAME
    - PHP_FPM_PM_MAX_CHILDREN
    - PHP_FPM_PM_MAX_REQUESTS
    - PHP_MEMORY_LIMIT
volumes:
  - /srv/storage/vault:/storage
deploy_timeout: 120
drain_timeout: 5
